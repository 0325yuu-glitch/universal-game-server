<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gravity Richest Tetris</title>
    <style>
        /* =========================================
           基本設定＆リッチデザイン定義
        ========================================= */
        :root {
            --bg-color: #0a0a0a;
            --text-color: #eee;
            --accent-color: #00f7ff; /* ネオンシアン */
            --accent-secondary: #ff00d4; /* ネオンピンク */
            
            /* ボタンデザイン用 */
            --btn-bg-grad: linear-gradient(145deg, rgba(40,40,40,0.8), rgba(20,20,20,0.9));
            --btn-border: 1px solid rgba(255,255,255,0.15);
            --btn-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.1);
            --btn-active-shadow: 0 2px 5px rgba(0,0,0,0.4), inset 0 2px 5px rgba(0,0,0,0.3);
            --btn-text-shadow: 0 0 10px var(--accent-color);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
        }

        /* アプリ全体のコンテナ */
        #game-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 600px; /* タブレットでの広がりすぎ防止 */
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* =========================================
           ヘッダー (スコア等)
        ========================================= */
        header {
            flex: 0 0 auto; /* 高さを固定しない */
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            background: rgba(0,0,0,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        .stat-box {
            text-align: center;
            text-transform: uppercase;
            font-size: 12px;
            color: #aaa;
            letter-spacing: 1px;
        }
        .stat-box span {
            display: block;
            font-size: 22px;
            color: var(--accent-color);
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
            margin-top: 2px;
        }

        /* =========================================
           メインゲームエリア (Canvas)
        ========================================= */
        #main-area {
            flex: 1 1 auto; /* 残りのスペースを全て使う */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 上寄せ */
            padding: 20px 10px 0; /* 上に少し余白 */
            overflow: hidden;
        }

        /* ゲームキャンバスのコンテナ */
        .canvas-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 247, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        canvas#tetris {
            background: rgba(0,0,0,0.8);
            display: block; /* 隙間をなくす */
        }

        /* サイドパネル (HOLD/NEXT) - 絶対配置でCanvasの横に置く */
        .side-panel {
            position: absolute;
            top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            border: var(--btn-border);
        }
        .panel-label {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-secondary);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .side-panel canvas {
            background: transparent;
        }
        #panel-hold { left: 10px; }
        #panel-next { right: 10px; }

        /* ゲームオーバー表示 */
        #game-over {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            padding: 30px 40px;
            border-radius: 15px;
            border: 2px solid var(--accent-secondary);
            text-align: center;
            z-index: 100;
            display: none;
            box-shadow: 0 0 50px rgba(255, 0, 212, 0.5);
        }
        #game-over h2 {
            margin: 0 0 15px;
            color: var(--accent-secondary);
            font-size: 32px;
            text-shadow: 0 0 10px rgba(255, 0, 212, 0.8);
        }
        #game-over p { font-size: 18px; color: #ccc; }
        #final-score { color: var(--accent-color); font-weight: bold; font-size: 28px; }
        #restart-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(45deg, var(--accent-color), var(--accent-secondary));
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        #restart-btn:active { transform: scale(0.95); }

        /* =========================================
           リッチコントローラーエリア
        ========================================= */
        #controls {
            flex: 0 0 auto; /* 高さを自動計算 */
            padding: 15px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px); /* すりガラス効果 */
            border-top: 1px solid rgba(255,255,255,0.1);
            
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 上段 (HOLD / HARD DROP) */
        .controls-top {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* 下段 (移動 / 回転) */
        .controls-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 140px; /* メイン操作部の高さ */
        }

        /* 十字キーエリア */
        .d-pad {
            position: relative;
            width: 140px; height: 140px;
        }
        /* アクションキーエリア */
        .action-pad {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 120px; height: 140px;
        }

        /* 共通ボタンスタイル */
        .btn {
            background: var(--btn-bg-grad);
            border: var(--btn-border);
            box-shadow: var(--btn-shadow);
            border-radius: 50%; /* 基本は丸 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: rgba(255,255,255,0.8);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.05s;
            position: absolute; /* 十字キー配置用 */
        }
        .btn:active {
            box-shadow: var(--btn-active-shadow);
            transform: scale(0.92);
            color: #fff;
        }
        /* アイコンSVG用 */
        .btn svg {
            width: 60%; height: 60%;
            fill: currentColor;
            filter: drop-shadow(0 0 5px currentColor);
        }

        /* 各ボタンの個別設定 */
        /* HOLD */
        #btn-hold {
            position: relative;
            width: 80px; height: 50px;
            border-radius: 25px;
            font-size: 14px; font-weight: bold;
            color: orange;
            text-shadow: 0 0 5px orange;
        }
        /* HARD DROP */
        #btn-hard {
            position: relative;
            width: 80px; height: 50px;
            border-radius: 25px;
            font-size: 14px; font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 5px var(--accent-color);
        }

        /* 十字キー配置 */
        #btn-left { width: 60px; height: 60px; top: 40px; left: 0; }
        #btn-right{ width: 60px; height: 60px; top: 40px; right: 0; }
        #btn-down {
            width: 60px; height: 70px; /* 少し縦長 */
            bottom: 0; left: 40px;
            border-radius: 30px; /* 楕円 */
        }

        /* 回転ボタン (最も大きく、押しやすく) */
        #btn-rot {
            position: relative;
            width: 100px; height: 100px;
            color: var(--accent-secondary);
            background: linear-gradient(145deg, rgba(60,20,40,0.8), rgba(30,10,20,0.9));
        }
        #btn-rot svg { width: 70%; height: 70%; }

    </style>
</head>
<body>
    <div id="game-wrapper">
        <header>
            <div class="stat-box">Score<span id="score">0</span></div>
            <div class="stat-box">Level<span id="level">1</span></div>
            <div class="stat-box">Lines<span id="lines">0</span></div>
        </header>

        <div id="main-area">
            <div class="side-panel" id="panel-hold">
                <div class="panel-label">HOLD</div>
                <canvas id="hold" width="60" height="60"></canvas>
            </div>

            <div class="canvas-container">
                <canvas id="tetris" width="200" height="400"></canvas>
            </div>

             <div class="side-panel" id="panel-next">
                <div class="panel-label">NEXT</div>
                <canvas id="next" width="60" height="180"></canvas>
            </div>

            <div id="game-over">
                <h2>GAME OVER</h2>
                <p>Final Score</p>
                <p><span id="final-score">0</span></p>
                <button id="restart-btn">PLAY AGAIN</button>
            </div>
        </div>

        <div id="controls">
            <div class="controls-top">
                <div class="btn" id="btn-hold">HOLD</div>
                <div class="btn" id="btn-hard">HARD</div>
            </div>
            <div class="controls-bottom">
                <div class="d-pad">
                    <div class="btn" id="btn-left">
                        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                    </div>
                    <div class="btn" id="btn-down">
                        <svg viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                    </div>
                    <div class="btn" id="btn-right">
                        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                    </div>
                </div>
                <div class="action-pad">
                    <div class="btn" id="btn-rot">
                        <svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
/* =========================================
   テトリスのコアロジック (変更なし)
========================================= */
// 定数定義
const COLS = 10;
const ROWS = 20;
let BLOCK_SIZE = 20; // 後で動的に計算

const COLORS = [
    null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'
];
const PIECES = [
    [],
    [[[1, 1, 1],[0, 1, 0]], 1], // T
    [[[2, 2],[2, 2]], 2],       // O
    [[[0, 3, 3],[3, 3, 0]], 3], // S
    [[[4, 4, 0],[0, 4, 4]], 4], // Z
    [[[5, 0, 0],[5, 5, 5]], 5], // J
    [[[0, 0, 6],[6, 6, 6]], 6], // L
    [[[0, 0, 0, 0],[7, 7, 7, 7],[0, 0, 0, 0],[0, 0, 0, 0]], 7] // I
];

// ゲーム状態
let grid, score, lines, level, gameOver, dropCounter, dropInterval, lastTime, animationId;
let player = { pos: {x: 0, y: 0}, matrix: null, colorIdx: 0 };
let holdPiece = null; let canHold = true;
let nextPieces = []; const NEXT_COUNT = 3;

// DOM要素取得
const canvas = document.getElementById('tetris');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nextCtx = nextCanvas.getContext('2d');
const holdCanvas = document.getElementById('hold');
const holdCtx = holdCanvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const linesEl = document.getElementById('lines');
const gameOverEl = document.getElementById('game-over');
const finalScoreEl = document.getElementById('final-score');
const restartBtn = document.getElementById('restart-btn');

/* --- 初期化とリサイズ処理 (★重要修正点) --- */

function init() {
    const mainArea = document.getElementById('main-area');
    // パディングなどを除いた実質的な利用可能エリアを取得
    const availW = mainArea.clientWidth - 40; // 左右のパネル+余白分を引く
    const availH = mainArea.clientHeight - 40; // 上下の余白分を引く

    // 幅と高さ、どちらの制約が厳しいかに合わせてブロックサイズを決定
    const sizeByWidth = Math.floor(availW / COLS);
    const sizeByHeight = Math.floor(availH / ROWS);
    BLOCK_SIZE = Math.min(sizeByWidth, sizeByHeight);

    // キャンバスサイズ設定
    canvas.width = BLOCK_SIZE * COLS;
    canvas.height = BLOCK_SIZE * ROWS;

    // サブキャンバスのスケール設定
    const subScale = BLOCK_SIZE * 0.7;
    // コンテキストをリセットしてからスケール設定
    nextCtx.setTransform(1, 0, 0, 1, 0, 0);
    holdCtx.setTransform(1, 0, 0, 1, 0, 0);
    nextCtx.scale(subScale, subScale);
    holdCtx.scale(subScale, subScale);
    
    resetGame();
}

function resetGame() {
    grid = createGrid(COLS, ROWS);
    score = 0; lines = 0; level = 1;
    gameOver = false; dropInterval = 1000;
    holdPiece = null; canHold = true;
    nextPieces = [];
    
    updateScore();
    gameOverEl.style.display = 'none';
    
    for(let i=0; i< NEXT_COUNT + 1; i++) nextPieces.push(createPiece());
    playerReset();
    if (animationId) cancelAnimationFrame(animationId);
    lastTime = performance.now(); // 時間をリセット
    gameLoop(lastTime);
}

function createGrid(w, h) {
    return Array.from({length: h}, () => Array(w).fill(0));
}

/* --- ゲームループ (変更なし) --- */
function gameLoop(time = 0) {
    if (gameOver) return;
    const deltaTime = time - lastTime;
    lastTime = time;
    dropCounter += deltaTime;
    if (dropCounter > dropInterval) playerDrop();
    draw();
    animationId = requestAnimationFrame(gameLoop);
}

/* --- 描画処理 (一部調整) --- */
function draw() {
    // メインキャンバスの描画
    ctx.setTransform(1, 0, 0, 1, 0, 0); // リセット
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; // 背景を少し透過させてリッチに
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(BLOCK_SIZE, BLOCK_SIZE); // スケール適用

    drawMatrix(grid, {x: 0, y: 0}, ctx);
    
    // ゴースト
    let ghostPos = { ...player.pos };
    while (!collide(grid, { pos: ghostPos, matrix: player.matrix })) ghostPos.y++;
    ghostPos.y--;
    ctx.globalAlpha = 0.2;
    drawMatrix(player.matrix, ghostPos, ctx, player.colorIdx);
    ctx.globalAlpha = 1.0;

    drawMatrix(player.matrix, player.pos, ctx, player.colorIdx);
    drawSidePanels();
}

function drawMatrix(matrix, offset, context, colorIdxOverride = null) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            const colorIndex = colorIdxOverride !== null ? (value ? colorIdxOverride : 0) : value;
            if (colorIndex !== 0) {
                const color = COLORS[colorIndex];
                // ブロックの本体
                context.fillStyle = color;
                context.fillRect(x + offset.x, y + offset.y, 1, 1);
                
                // リッチな立体表現 (光と影)
                context.lineWidth = 0.05;
                context.strokeStyle = 'rgba(255,255,255,0.5)';
                context.beginPath();
                context.moveTo(x + offset.x, y + offset.y + 1);
                context.lineTo(x + offset.x, y + offset.y);
                context.lineTo(x + offset.x + 1, y + offset.y);
                context.stroke();
                
                context.strokeStyle = 'rgba(0,0,0,0.3)';
                context.beginPath();
                context.moveTo(x + offset.x + 1, y + offset.y);
                context.lineTo(x + offset.x + 1, y + offset.y + 1);
                context.lineTo(x + offset.x, y + offset.y + 1);
                context.stroke();
            }
        });
    });
}

function drawSidePanels() {
    // NEXT
    nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    let yOffset = 0.5;
    for(let i=0; i<NEXT_COUNT; i++) {
        const piece = nextPieces[i];
        // 中央揃えの計算
        const xOffset = (4 - piece.matrix[0].length) / 2;
        drawMatrix(piece.matrix, {x: xOffset, y: yOffset}, nextCtx, piece.colorIdx);
        yOffset += piece.matrix.length + 0.5;
    }
    // HOLD
    holdCtx.clearRect(0, 0, holdCanvas.width, holdCanvas.height);
    if (holdPiece) {
        const xOffset = (4 - holdPiece.matrix[0].length) / 2;
        const yOffset = (4 - holdPiece.matrix.length) / 2;
        drawMatrix(holdPiece.matrix, {x: xOffset, y: yOffset}, holdCtx, holdPiece.colorIdx);
    }
}

/* --- プレイヤー操作ロジック (変更なし) --- */
function createPiece() {
    const pieceIdx = (Math.random() * 7 | 0) + 1;
    const pieceData = PIECES[pieceIdx];
    return { matrix: pieceData[0], colorIdx: pieceData[1], typeIdx: pieceIdx };
}
function playerReset() {
    const next = nextPieces.shift();
    player.matrix = next.matrix; player.colorIdx = next.colorIdx; player.typeIdx = next.typeIdx;
    nextPieces.push(createPiece());
    player.pos.y = 0;
    player.pos.x = (COLS / 2 | 0) - (player.matrix[0].length / 2 | 0);
    canHold = true;
    if (collide(grid, player)) {
        gameOver = true;
        cancelAnimationFrame(animationId);
        finalScoreEl.textContent = score;
        gameOverEl.style.display = 'block';
    }
}
function playerDrop() {
    player.pos.y++;
    if (collide(grid, player)) {
        player.pos.y--; merge(grid, player); playerReset(); arenaSweep(); updateScore();
    }
    dropCounter = 0;
}
function playerMove(dir) {
    player.pos.x += dir;
    if (collide(grid, player)) player.pos.x -= dir;
}
function playerRotate(dir) {
    const pos = player.pos.x; let offset = 1;
    rotate(player.matrix, dir);
    while (collide(grid, player)) {
        player.pos.x += offset; offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir); player.pos.x = pos; return;
        }
    }
}
function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
    if (dir > 0) matrix.forEach(row => row.reverse()); else matrix.reverse();
}
function playerHardDrop() {
    while (!collide(grid, player)) player.pos.y++;
    player.pos.y--; merge(grid, player); playerReset(); arenaSweep(); updateScore(); dropCounter = 0;
}
function playerHold() {
    if (!canHold) return;
    const current = { matrix: player.matrix, colorIdx: player.colorIdx, typeIdx: player.typeIdx };
    if (holdPiece === null) { holdPiece = current; playerReset(); }
    else {
        const temp = holdPiece; holdPiece = current;
        player.matrix = temp.matrix; player.colorIdx = temp.colorIdx; player.typeIdx = temp.typeIdx;
        player.pos.y = 0; player.pos.x = (COLS / 2 | 0) - (player.matrix[0].length / 2 | 0);
    }
    canHold = false;
}

/* --- ゲームメカニクス (変更なし) --- */
function collide(arena, player) {
    const [m, o] = [player.matrix, player.pos];
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
        }
    }
    return false;
}
function merge(arena, player) {
    player.matrix.forEach((row, y) => row.forEach((value, x) => {
        if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = player.colorIdx;
    }));
}
function arenaSweep() {
    let rowCount = 0;
    outer: for (let y = grid.length - 1; y > 0; --y) {
        for (let x = 0; x < grid[y].length; ++x) { if (grid[y][x] === 0) continue outer; }
        const row = grid.splice(y, 1)[0].fill(0); grid.unshift(row); ++y; rowCount++;
    }
    if (rowCount > 0) {
        lines += rowCount;
        score += rowCount * 100 * level * (rowCount > 1 ? rowCount * 1.5 : 1); // ボーナス強化
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(100, 1000 - (level - 1) * 100);
    }
}
function updateScore() {
    scoreEl.innerText = score; levelEl.innerText = level; linesEl.innerText = lines;
}

/* --- 入力イベントハンドリング --- */
function setupTouchButton(id, action) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault(); if (!gameOver) action();
    }, { passive: false });
}
setupTouchButton('btn-left', () => playerMove(-1));
setupTouchButton('btn-right', () => playerMove(1));
setupTouchButton('btn-down', () => playerDrop());
setupTouchButton('btn-rot', () => playerRotate(1));
setupTouchButton('btn-hard', () => playerHardDrop());
setupTouchButton('btn-hold', () => playerHold());

restartBtn.addEventListener('touchstart', resetGame);
restartBtn.addEventListener('click', resetGame);

// 初期化実行とリサイズ対応
window.addEventListener('load', init);
window.addEventListener('resize', () => {
    // リサイズ時にゲームをリセットせずにサイズだけ合わせる簡易実装
    if (!gameOver) init(); 
});
// 初回起動用（loadイベントが発火しない場合への保険）
if (document.readyState === 'complete') init();

</script>
</body>
</html>
