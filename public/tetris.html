<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gravity Cyber Tetris v10</title>
    <style>
        :root {
            --bg-color: #050510;
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --glass-bg: rgba(20, 30, 40, 0.9);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden; touch-action: none;
            display: flex; flex-direction: column;
        }

        #game-wrapper {
            display: flex; flex-direction: column;
            height: 100%; width: 100%;
            max-width: 600px; margin: 0 auto;
        }

        #main-area {
            flex: 1; position: relative;
            display: flex; justify-content: center; align-items: center;
            gap: 10px; padding: 10px;
        }

        .board-container {
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            background: rgba(0, 0, 0, 0.9);
            position: relative;
        }
        canvas#tetris { display: block; }

        .side-col {
            display: flex; flex-direction: column; justify-content: center;
            width: 70px; gap: 15px;
        }
        .panel-box {
            background: var(--glass-bg);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px; padding: 5px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 70px;
        }
        .label { font-size: 10px; color: #aaa; margin-bottom: 5px; font-weight: bold; }
        .stats { text-align: center; display: flex; flex-direction: column; gap: 5px; }
        .stat-val { font-size: 16px; font-weight: bold; color: #fff; text-shadow: 0 0 5px var(--neon-blue); }

        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 2px solid var(--neon-pink);
            padding: 30px; text-align: center; z-index: 100; display: none; border-radius: 10px;
        }
        #restart-btn {
            background: var(--neon-blue); border: none; padding: 10px 20px;
            font-size: 16px; font-weight: bold; border-radius: 20px; margin-top: 15px;
        }

        /* SOUND TOGGLE */
        #sound-toggle {
            position: absolute; top: -50px; right: 10px;
            height: 36px; padding: 0 20px;
            background: rgba(0,0,0,0.8); border: 1px solid #666;
            color: #aaa; font-size: 12px; font-weight: bold;
            border-radius: 18px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; user-select: none; z-index: 200;
        }
        #sound-toggle.on { 
            background: var(--neon-blue); color: #000; border-color: var(--neon-blue); 
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        }

        /* CONTROLS */
        #controls {
            flex: 0 0 220px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px 20px; position: relative;
        }
        .d-pad { position: relative; width: 150px; height: 150px; }
        .btn {
            position: absolute; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center;
            color: #fff; border-radius: 10px;
        }
        .btn:active, .btn.active { background: rgba(0,243,255,0.3); border-color: var(--neon-blue); }
        .btn svg { width: 30px; height: 30px; fill: currentColor; }
        
        #btn-up    { width: 50px; height: 50px; top: 0; left: 50px; }
        #btn-left  { width: 50px; height: 50px; top: 50px; left: 0; }
        #btn-right { width: 50px; height: 50px; top: 50px; right: 0; }
        #btn-down  { width: 50px; height: 60px; bottom: -10px; left: 50px; }

        .action-area { width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; }
        #btn-rot {
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(255,0,85,0.2); border: 2px solid var(--neon-pink);
            display: flex; justify-content: center; align-items: center;
        }
        #btn-rot:active { background: rgba(255,0,85,0.5); transform: scale(0.95); }

        #btn-hold-touch {
            position: absolute; top: -45px; left: 20px;
            width: 80px; height: 36px; background: #ffaa00; color: #000;
            font-weight: bold; border-radius: 18px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="main-area">
            <div class="side-col">
                <div class="panel-box"><div class="label">HOLD</div><canvas id="hold"></canvas></div>
                <div class="stats">
                    <div class="label">SCORE</div><div class="stat-val" id="score">0</div>
                    <div class="label">LINES</div><div class="stat-val" id="lines">0</div>
                </div>
            </div>
            <div class="board-container">
                <canvas id="tetris"></canvas>
                <div id="game-over">
                    <h2 style="color:var(--neon-pink);margin:0;">GAME OVER</h2>
                    <p>SCORE: <span id="final-score">0</span></p>
                    <button id="restart-btn">RETRY</button>
                </div>
            </div>
            <div class="side-col">
                <div class="panel-box"><div class="label">NEXT</div><canvas id="next"></canvas></div>
            </div>
        </div>

        <div id="controls">
            <div id="btn-hold-touch">HOLD</div>
            <div id="sound-toggle">🔇 SOUND OFF</div>

            <div class="d-pad">
                <div class="btn" id="btn-up"><svg viewBox="0 0 24 24"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg></div>
                <div class="btn" id="btn-left"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div>
                <div class="btn" id="btn-down"><svg viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg></div>
                <div class="btn" id="btn-right"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
            </div>
            <div class="action-area">
                <div id="btn-rot"><svg viewBox="0 0 24 24" fill="#fff" width="40" height="40"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg></div>
            </div>
        </div>
    </div>

<script>
const COLS = 10;
const ROWS = 20;
let BLOCK_SIZE = 20;
const COLORS = [null, '#a000f0', '#f0f000', '#00f000', '#f00000', '#0000f0', '#f0a000', '#00f0f0'];
const PIECES = [
    [],
    [[[0, 1, 0],[1, 1, 1],[0, 0, 0]], 1], // T
    [[[2, 2],[2, 2]], 2],                 // O
    [[[0, 3, 3],[3, 3, 0],[0, 0, 0]], 3], // S
    [[[4, 4, 0],[0, 4, 4],[0, 0, 0]], 4], // Z
    [[[5, 0, 0],[5, 5, 5],[0, 0, 0]], 5], // J
    [[[0, 0, 6],[6, 6, 6],[0, 0, 0]], 6], // L
    [[[0, 0, 0, 0],[7, 7, 7, 7],[0, 0, 0, 0],[0, 0, 0, 0]], 7] // I
];

// --- SOUND MANAGER (Absolute Path Fix) ---
const SERVER_URL = "https://universal-game-server.onrender.com"; // あなたのサーバーURL

const Sound = {
    bgm: null,
    files: {
        rotate: SERVER_URL + '/static/assets/tetris/rotate.mp3',
        drop:   SERVER_URL + '/static/assets/tetris/drop.mp3',
        clear:  SERVER_URL + '/static/assets/tetris/clear.mp3',
        gameover: SERVER_URL + '/static/assets/tetris/gameover.mp3',
        bgm:    SERVER_URL + '/static/assets/tetris/bgm.mp3'
    },
    enabled: false,
    
    init() {
        this.bgm = new Audio(this.files.bgm);
        this.bgm.loop = true;
        this.bgm.volume = 0.4;
        
        // エラーハンドリング (デバッグ用)
        this.bgm.onerror = () => {
            console.error("BGM Load Error: " + this.bgm.src);
        };
    },

    play(name) {
        if (!this.enabled) return;
        const src = this.files[name];
        if (!src) return;
        
        if (name !== 'bgm') {
            const se = new Audio(src);
            se.volume = 0.8;
            se.play().catch(e => {
                // 自動再生ポリシーなどのエラーはコンソールへ
                console.log("SE Play Error:", e);
            });
        }
    },

    toggle() {
        this.enabled = !this.enabled;
        const btn = document.getElementById('sound-toggle');
        
        if (this.enabled) {
            btn.textContent = "🔊 SOUND ON";
            btn.classList.add('on');
            
            // 再生テスト
            this.bgm.play().catch(e => {
                alert("再生エラー: " + e.message + "\nURLを確認してください:\n" + this.files.bgm);
                this.enabled = false;
                btn.textContent = "🔇 ERROR";
                btn.classList.remove('on');
            });
            
        } else {
            btn.textContent = "🔇 SOUND OFF";
            btn.classList.remove('on');
            this.bgm.pause();
        }
    }
};

// --- STATE ---
let grid = [];
let score = 0, lines = 0, level = 1;
let gameOver = false;
let dropCounter = 0, dropInterval = 1000, lastTime = 0;
let animationId = null;
let player = { pos: {x: 0, y: 0}, matrix: null, colorIdx: 0 };
let holdPiece = null, canHold = true, nextPieces = [];
let clearingRows = [], clearAnimStart = 0;

// --- DOM ---
const canvas = document.getElementById('tetris');
const ctx = canvas.getContext('2d');
const nextCtx = document.getElementById('next').getContext('2d');
const holdCtx = document.getElementById('hold').getContext('2d');

// --- INIT ---
function init() {
    let availW = window.innerWidth - 180;
    let availH = window.innerHeight - 240;
    if (availW < 100) availW = 200;
    if (availH < 200) availH = 400;

    const sizeByW = Math.floor(availW / COLS);
    const sizeByH = Math.floor(availH / ROWS);
    BLOCK_SIZE = Math.min(sizeByW, sizeByH);
    
    canvas.width = BLOCK_SIZE * COLS;
    canvas.height = BLOCK_SIZE * ROWS;

    const subBlock = 14;
    document.getElementById('next').width = subBlock * 5;
    document.getElementById('next').height = subBlock * 12;
    document.getElementById('hold').width = subBlock * 5;
    document.getElementById('hold').height = subBlock * 5;

    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(BLOCK_SIZE, BLOCK_SIZE);
    nextCtx.setTransform(1, 0, 0, 1, 0, 0); nextCtx.scale(subBlock, subBlock);
    holdCtx.setTransform(1, 0, 0, 1, 0, 0); holdCtx.scale(subBlock, subBlock);

    if (!grid || grid.length === 0) resetGame();
    else draw();
    
    Sound.init();
}

function resetGame() {
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    score = 0; lines = 0; level = 1; dropInterval = 1000;
    gameOver = false; holdPiece = null; canHold = true; nextPieces = [];
    clearingRows = [];

    document.getElementById('game-over').style.display = 'none';
    updateStats();

    for(let i=0; i<4; i++) nextPieces.push(createPiece());
    playerReset();
    
    if (animationId) cancelAnimationFrame(animationId);
    lastTime = performance.now();
    gameLoop(lastTime);
    
    if (Sound.enabled) {
        Sound.bgm.currentTime = 0;
        Sound.bgm.play().catch(()=>{});
    }
}

function gameLoop(time = 0) {
    if (gameOver) return;
    const deltaTime = time - lastTime;
    lastTime = time;

    if (clearingRows.length > 0) {
        if (time - clearAnimStart > 200) finalizeClear();
        draw();
        animationId = requestAnimationFrame(gameLoop);
        return;
    }

    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
        playerDrop();
    }

    draw();
    animationId = requestAnimationFrame(gameLoop);
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, COLS, ROWS);
    drawMatrix(grid, {x:0, y:0}, ctx);

    if (clearingRows.length > 0) {
        ctx.fillStyle = '#fff';
        clearingRows.forEach(y => ctx.fillRect(0, y, COLS, 1));
    } else {
        let ghostPos = { ...player.pos };
        while (!collide(grid, { pos: ghostPos, matrix: player.matrix })) ghostPos.y++;
        ghostPos.y--;
        ctx.globalAlpha = 0.2;
        drawMatrix(player.matrix, ghostPos, ctx, player.colorIdx);
        ctx.globalAlpha = 1.0;
        drawMatrix(player.matrix, player.pos, ctx, player.colorIdx);
    }
    drawSides();
}

function drawMatrix(matrix, offset, context, colorIdxOverride = null) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            const idx = colorIdxOverride !== null ? (value ? colorIdxOverride : 0) : value;
            if (idx !== 0) {
                context.fillStyle = COLORS[idx];
                context.fillRect(x + offset.x, y + offset.y, 1, 1);
                context.lineWidth = 0.05;
                context.strokeStyle = 'rgba(255,255,255,0.5)';
                context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                context.fillStyle = 'rgba(255,255,255,0.2)';
                context.fillRect(x + offset.x + 0.1, y + offset.y + 0.1, 0.8, 0.8);
            }
        });
    });
}

function drawSides() {
    nextCtx.clearRect(0,0,10,20); holdCtx.clearRect(0,0,10,10);
    let yOff = 1;
    for(let i=0; i<3; i++) {
        const p = nextPieces[i];
        if(!p) continue;
        const xOff = (5 - p.matrix[0].length) / 2;
        drawMatrix(p.matrix, {x: xOff, y: yOff}, nextCtx, p.colorIdx);
        yOff += p.matrix.length + 1;
    }
    if (holdPiece) {
        const xOff = (5 - holdPiece.matrix[0].length) / 2;
        const yOff = (5 - holdPiece.matrix.length) / 2;
        drawMatrix(holdPiece.matrix, {x: xOff, y: yOff}, holdCtx, holdPiece.colorIdx);
    }
}

function createPiece() {
    const idx = (Math.random() * 7 | 0) + 1;
    const data = PIECES[idx];
    return { matrix: data[0].map(r=>[...r]), colorIdx: data[1] };
}

function playerReset() {
    const next = nextPieces.shift();
    player.matrix = next.matrix; player.colorIdx = next.colorIdx;
    nextPieces.push(createPiece());
    player.pos.y = 0;
    player.pos.x = (COLS / 2 | 0) - (player.matrix[0].length / 2 | 0);
    canHold = true;
    if (collide(grid, player)) {
        gameOver = true;
        Sound.play('gameover');
        Sound.bgm.pause();
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over').style.display = 'block';
    }
}

function playerDrop() {
    player.pos.y++;
    if (collide(grid, player)) {
        player.pos.y--; merge(grid, player); 
        Sound.play('drop');
        playerReset(); arenaSweep(); dropCounter = 0;
    }
    dropCounter = 0;
}

function playerHardDrop() {
    while (!collide(grid, player)) player.pos.y++;
    player.pos.y--; merge(grid, player); 
    Sound.play('drop');
    playerReset(); arenaSweep(); dropCounter = 0;
}

function playerMove(dir) {
    player.pos.x += dir;
    if (collide(grid, player)) player.pos.x -= dir;
}

function playerRotate(dir) {
    const pos = player.pos.x; let offset = 1;
    rotate(player.matrix, dir);
    while (collide(grid, player)) {
        player.pos.x += offset; offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir); player.pos.x = pos; return;
        }
    }
    Sound.play('rotate');
}

function rotate(matrix, dir) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
    if (dir > 0) matrix.forEach(row => row.reverse()); else matrix.reverse();
}

function playerHold() {
    if (!canHold || gameOver) return;
    Sound.play('rotate');
    const current = { matrix: player.matrix, colorIdx: player.colorIdx };
    if (holdPiece === null) {
        holdPiece = current; playerReset();
    } else {
        const temp = holdPiece; holdPiece = current;
        player.matrix = temp.matrix; player.colorIdx = temp.colorIdx;
        player.pos.y = 0; player.pos.x = (COLS / 2 | 0) - (player.matrix[0].length / 2 | 0);
    }
    canHold = false;
}

function collide(arena, player) {
    const [m, o] = [player.matrix, player.pos];
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
        }
    }
    return false;
}

function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = player.colorIdx;
        });
    });
}

function arenaSweep() {
    let rows = [];
    outer: for (let y = grid.length - 1; y >= 0; --y) {
        for (let x = 0; x < grid[y].length; ++x) if (grid[y][x] === 0) continue outer;
        rows.push(y);
    }
    if (rows.length > 0) { 
        clearingRows = rows; clearAnimStart = performance.now();
        Sound.play('clear');
    }
}

function finalizeClear() {
    let rowCount = clearingRows.length;
    clearingRows.sort((a,b) => a - b);
    clearingRows.forEach(y => { grid.splice(y, 1); grid.unshift(Array(COLS).fill(0)); });
    score += rowCount * 100 * level * rowCount;
    lines += rowCount; level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 1000 - (level - 1) * 50);
    updateStats();
    clearingRows = [];
}

function updateStats() {
    document.getElementById('score').innerText = score;
    document.getElementById('lines').innerText = lines;
}

// --- CONTROLS ---
let downInterval = null;
function startSoftDrop(e) {
    if (e.cancelable) e.preventDefault();
    if (gameOver || clearingRows.length > 0) return;
    playerDrop();
    clearInterval(downInterval);
    downInterval = setInterval(() => {
        if (!gameOver && clearingRows.length === 0) playerDrop();
    }, 40);
    document.getElementById('btn-down').classList.add('active');
}
function stopSoftDrop(e) {
    if (e.cancelable) e.preventDefault();
    clearInterval(downInterval);
    document.getElementById('btn-down').classList.remove('active');
}

function setupBtn(id, action) {
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameOver && clearingRows.length === 0) action();
        btn.classList.add('active');
    }, { passive: false });
    btn.addEventListener('touchend', () => btn.classList.remove('active'));
    btn.addEventListener('mousedown', () => { if (!gameOver) action(); });
}

setupBtn('btn-left', () => playerMove(-1));
setupBtn('btn-right', () => playerMove(1));
setupBtn('btn-up', () => playerHardDrop());
setupBtn('btn-rot', () => playerRotate(1));
setupBtn('btn-hold-touch', () => playerHold());

const btnDown = document.getElementById('btn-down');
btnDown.addEventListener('touchstart', startSoftDrop, { passive: false });
btnDown.addEventListener('touchend', stopSoftDrop);
btnDown.addEventListener('mousedown', startSoftDrop);
btnDown.addEventListener('mouseup', stopSoftDrop);
btnDown.addEventListener('mouseleave', stopSoftDrop);

document.getElementById('restart-btn').addEventListener('click', resetGame);
document.getElementById('restart-btn').addEventListener('touchstart', resetGame);

// SOUND TOGGLE
document.getElementById('sound-toggle').addEventListener('click', () => Sound.toggle());
document.getElementById('sound-toggle').addEventListener('touchstart', (e) => {
    e.preventDefault(); Sound.toggle();
});

init();
window.addEventListener('resize', init);
window.addEventListener('load', init);
setTimeout(init, 100);
setTimeout(init, 500);
setTimeout(init, 1000);
</script>
</body>
</html>
